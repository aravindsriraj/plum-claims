# Builds the frontend image. API_URL is a runtime env on Cloud Run / compose —
# not a build arg (see app/api/[...path]/route.ts).
# Usage: gcloud builds submit --config cloudbuild.yaml .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/plum/frontend
      - .
images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/plum/frontend
