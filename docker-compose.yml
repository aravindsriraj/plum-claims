services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      # GEMINI_API_KEY enables vision extraction for real uploads.
      # Without it, simulation-mode claims still work end-to-end.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ORIGINS: "*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
